plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    // Bug fix (2026-08-30, build real: "No valid input files for searge
    // could be read" -> luego, tras encontrar el SRG, "Unable to locate
    // obfuscation mapping for @Inject target place"): cablear
    // -AreobfSrgFile a mano contra build/createSrgToMcp/output.srg (ver
    // historial debajo) apuntaba al mapping en la direccion equivocada
    // para lo que el Annotation Processor de Mixin necesita en compile
    // time. MixinGradle es el mecanismo oficial (recomendado por la wiki
    // de SpongePowered/Mixin y usado por mods reales en 1.20.1 - ej.
    // Curios, ver issue #502 de su repo) que localiza el mapping CORRECTO
    // automaticamente y lo pasa al AP - reemplaza toda la config manual
    // de compileJava de abajo.
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'com.kve'
// 2026-10-06: dos jars - shovel_api (mod shovel_api, lo que el juego
// necesita) y shovel_js (mod shovel_js, la interfaz). Ver jar/editorJar abajo.
archivesBaseName = 'shovel_api'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Mixin (2026-08-30): MixinGradle (plugin agregado arriba) genera
// src/main/resources/shovel_api.refmap.json automaticamente en cada compile -
// esto reemplaza el bloque compileJava.options.compilerArgs +
// compileJava.dependsOn 'createSrgToMcp' que se usaba antes a mano
// (ver historial de fixes: fallaba porque el mapping que necesita el
// Annotation Processor de Mixin en compile time no es simplemente
// build/createSrgToMcp/output.srg leido crudo - MixinGradle sabe
// resolver esto solo). Nombre de sourceSet + refmap deben matchear
// "refmap" en shovel_api.mixins.json.
mixin {
    add sourceSets.main, 'shovel_api.refmap.json'
    // Bug real 2026-09-30 (log de juego: "AttributeMap cannot be cast to
    // AttributeMapAccessor"): Forge 1.20.1 carga los mixins de un mod SOLO
    // desde el atributo MixinConfigs del MANIFEST.MF - el bloque [[mixins]]
    // de mods.toml es de NeoForge y Forge 47 lo ignora. Sin esto ningun
    // mixin de KVE se aplicaba en el juego (spawn caps en generacion
    // natural, atributos modded, velocidad de ataque de mobs).
    config 'shovel_api.mixins.json'
    config 'shovel_js.mixins.json'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    reobf = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Bug fix (2026-08-30, "spawn caps no aplican en generacion
            // natural/jigsaw"): habilita el Mixin de com.kve.mixin en el
            // run de dev - sin esto el refmap no se remapea y el mixin no
            // se aplica al arrancar. Ver shovel_api.mixins.json / SinglePoolElementMixin.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                shovel_api { source sourceSets.main }
                shovel_js { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                shovel_api { source sourceSets.main }
                shovel_js { source sourceSets.main }
            }
        }
    }
}

repositories {
    mavenCentral() // needed to resolve the JUnit test dependencies below

    // KubeJS/Rhino - OFFICIAL maven (confirmed live at kubejs.com/downloads/dev-builds),
    // needed ONLY at compile time so KveKubeJSPlugin.java (com.kve.integration.kubejs)
    // resolves against the real KubeJS classes. Nothing here ships in the final jar
    // or is required at runtime - see the compileOnly deps below.
    // NOTE: maven.saps.dev is a third-party community mirror that does NOT
    // reliably host every build (confirmed: it 404s on kubejs-forge:2001.6.5-build.26
    // and rhino-forge:2001.2.3-build.10) - use the official latvian.dev maven instead.
    maven {
        url = "https://maven.latvian.dev/releases"
        content { includeGroup "dev.latvian.mods" }
    }
    maven {
        url = "https://maven.architectury.dev"
        content { includeGroup "dev.architectury" }
    }

    // Jade - published to Modrinth's own maven, no separate dev maven of
    // its own. Same soft-dependency shape as KubeJS below: compileOnly
    // only, so KveJadePlugin/RequiredToolComponentProvider resolve against
    // the real Jade API classes, WITHOUT bundling Jade into kve's jar or
    // requiring it to be installed for KVE to run (mods.toml declares
    // modId=jade, mandatory=false to match).
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }

    // JEI / EMI API (2026-09-25, bug "el boton de KVE se renderiza arriba a
    // la derecha, no al lado de la receta") - compileOnly, mismo patron que
    // Jade: KveJeiPlugin/KveEmiPlugin se descubren por la anotacion de cada
    // visor y nunca se cargan si el visor no esta instalado.
    maven {
        url = "https://maven.blamejared.com"
        content { includeGroup "mezz.jei" }
    }
    maven {
        url = "https://maven.terraformersmc.com/releases"
        content { includeGroup "dev.emi" }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.28'

    // Mixin (2026-08-30, "spawn caps no aplican en generacion natural/
    // jigsaw"): Forge ya trae Mixin en el runtime classpath, esto solo
    // agrega el annotation processor que genera el refmap en compile time
    // (shovel_api.refmap.json, ver compileJava.options.compilerArgs abajo y
    // shovel_api.mixins.json). No se agrega como dependencia normal - solo
    // annotationProcessor, igual que cualquier setup Mixin+ForgeGradle.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // KubeJS integration is OPTIONAL at runtime (see mods.toml: modId=kubejs,
    // mandatory=false). compileOnly gives javac/the IDE the real KubeJS
    // classes to check KveKubeJSPlugin.java against, WITHOUT bundling KubeJS
    // into kve's jar or requiring it to be installed for KVE to run.
    compileOnly fg.deobf("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    compileOnly fg.deobf("dev.latvian.mods:rhino-forge:${rhino_version}")
    compileOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")

    // Jade integration is OPTIONAL at runtime (see mods.toml: modId=jade,
    // mandatory=false) - same compileOnly/fg.deobf treatment as the
    // KubeJS deps above, for the same reason (Jade ships an
    // official/Mojang-mapped jar already in newer builds, but fg.deobf is
    // a harmless no-op if so, and required if the resolved build still
    // ships SRG-named classes).
    compileOnly fg.deobf("maven.modrinth:jade:${jade_version}")

    // JEI/EMI: solo la API, solo compile time (ver repositorios arriba).
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${jei_version}")
    compileOnly fg.deobf("dev.emi:emi-forge:${emi_version}:api")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Belt-and-suspenders: make sure the test source set can see the same
// Minecraft/Forge classes main compiles/runs against, regardless of exactly
// how ForgeGradle wires its 'minecraft' dependency into configurations.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

// Plain JUnit 5 tests for the copy()/undo data-model logic (see
// src/test/java/com/kve/common/kubejs/*CopyTest.java). These only exercise
// the 5 undo systems' copy() methods on plain data objects (ItemStack.EMPTY,
// not real registered items), so they don't need a running game or FML
// bootstrap - just the vanilla classes on the compile/runtime classpath,
// which ForgeGradle already provides to sourceSets.main and therefore to
// sourceSets.test through the normal testImplementation/implementation
// extension.
test {
    useJUnitPlatform()
}

// ---------------------------------------------------------------------------
// Separacion runtime / editor (2026-10-06). Mismo source set, dos jars:
//  - jar        -> shovel_api-<ver>.jar (mod "shovel_api"): todo menos los
//                  paquetes del editor, mas todos los recursos (assets/data/lang).
//  - editorJar  -> shovel_js-<ver>.jar (mod "shovel_js"): solo los paquetes
//                  del editor. Depende del runtime.
// Los paquetes no se pueden repartir entre jars (cada jar es un modulo de
// Java): la lista va por paquete entero. RuntimeEditorSplitTest verifica que
// ninguna clase del runtime referencie estos paquetes.
// ---------------------------------------------------------------------------
// Version de Minecraft en el nombre de los jars (CurseForge: no confundir 1.20.1 con 1.21.1).
def MC_VERSION_TAG = '1.20.1'

def EDITOR_PACKAGES = [
    'com/kve/client/**',
    'com/kve/editor/**',
    'com/kve/integration/viewer/**',
    'com/kve/common/network/**',
]
ext.editorPackages = EDITOR_PACKAGES

def manifestAttrs = { String title, String mixinConfig -> [
    'Specification-Title'     : title,
    'Specification-Version'   : '1',
    'Implementation-Title'    : title,
    'Implementation-Version'  : project.version,
    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
    // Ver comentario en mixin {} arriba: sin esto Forge 1.20.1 no aplica ningun mixin.
    'MixinConfigs'            : mixinConfig
] }

jar {
    archiveVersion = "${MC_VERSION_TAG}-${project.version}"
    from(rootProject.file('../LICENSE'))
    exclude EDITOR_PACKAGES
    // Solo los de src/main/resources (el mods.toml de dev declara los dos mods);
    // un exclude por patron tambien sacaria el de src/packaging/runtime.
    def mainResources = file("$buildDir/resources/main").toPath()
    exclude { el -> el.file.toPath().startsWith(mainResources) && (el.path == 'META-INF/mods.toml' || el.path == 'shovel_js.mixins.json') }
    from('src/packaging/runtime')
    manifest { attributes(manifestAttrs('shovel_api', 'shovel_api.mixins.json')) }
}

tasks.register('editorJar', Jar) {
    archiveBaseName = 'shovel_js'
    archiveVersion = "${MC_VERSION_TAG}-${project.version}"
    from(rootProject.file('../LICENSE'))
    from(sourceSets.main.output) {
        include EDITOR_PACKAGES
        include 'shovel_js.mixins.json', 'shovel_api.refmap.json', 'logo.png', 'pack.mcmeta'
    }
    from('src/packaging/editor')
    manifest { attributes(manifestAttrs('shovel_js', 'shovel_js.mixins.json')) }
}

reobf {
    editorJar {}
}
tasks.named('editorJar') { finalizedBy 'reobfEditorJar' }
tasks.named('assemble') { dependsOn 'editorJar' }
